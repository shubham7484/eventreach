services:
  # Backend API Web Service
  - type: web
    name: eventreach-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Frontend Static Site
  - type: web
    name: eventreach-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
